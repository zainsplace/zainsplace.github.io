<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- The app uses inline onclick handlers, so scripts need 'unsafe-inline'. The policy stops any injected script sending data off-site (connect-src, img-src). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>BTEC IT Revision</title>
  <meta name="description" content="Revision hub for BTEC National IT — Unit 1 and Unit 2. Learn path with spaced memory, exam-style questions, past papers, mocks, battles and progress tracking.">
  <meta name="theme-color" content="#0F172A">
  <meta property="og:title" content="BTEC IT Revision">
  <meta property="og:description" content="Learn path, exam questions, past papers and battles for BTEC National IT, Units 1 and 2.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://zainsplace.github.io/revision/">
  <link rel="canonical" href="https://zainsplace.github.io/revision/">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230F172A'/%3E%3Ctext x='50' y='70' font-size='54' font-family='system-ui,sans-serif' font-weight='800' fill='%23F8FAFC' text-anchor='middle'%3ER%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css?v=34">
</head>
<body>

<a class="skip-link" href="#main-content" onclick="event.preventDefault();el('main-content').focus()">Skip to content</a>

<!-- Sidebar backdrop (mobile only) -->
<div class="sidebar-backdrop" id="sidebar-backdrop" onclick="closeSidebar()"></div>

<!-- Sidebar: a fixed column from 768px; a drawer (hamburger) on phones -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-top">
    <div class="sidebar-wordmark">
      <span class="sidebar-icon-mark" id="brand-mark">U2</span>
      <span class="sidebar-logo-text" id="brand-text">Unit 2 Cyber</span>
    </div>
    <div class="unit-switch" role="group" aria-label="Choose unit">
      <button class="unit-switch-btn" data-unit="u1" aria-pressed="false">
        <span class="unit-switch-code">U1</span><span class="unit-switch-name">IT Systems</span>
      </button>
      <button class="unit-switch-btn" data-unit="u2" aria-pressed="false">
        <span class="unit-switch-code">U2</span><span class="unit-switch-name">Cyber Security</span>
      </button>
    </div>
  </div>
  <nav class="sidebar-nav" aria-label="Main">
    <button class="sidebar-btn" data-page="home" onclick="sidebarNav('home')"><span class="sb-emoji" aria-hidden="true">🏠</span><span>Home</span></button>
    <button class="sidebar-btn" data-page="learn" onclick="sidebarNav('learn', {tab:'path'})"><span class="sb-emoji" aria-hidden="true">📚</span><span>Learn</span></button>
    <button class="sidebar-btn" data-page="exam" onclick="sidebarNav('exam')"><span class="sb-emoji" aria-hidden="true">📝</span><span>Exam</span></button>
    <button class="sidebar-btn" data-page="search" onclick="sidebarNav('search')"><span class="sb-emoji" aria-hidden="true">🔍</span><span>Search</span></button>
    <button class="sidebar-btn" data-page="profile" onclick="sidebarNav('profile')"><span class="sb-emoji" aria-hidden="true">👤</span><span>Profile</span></button>
  </nav>
  <button class="g-btn g-btn-block sidebar-study" onclick="studyNow()"><span aria-hidden="true">🎮</span> Study</button>
  <!-- The active unit's sections, filled by applyUnitChrome() -->
  <div class="sidebar-sections" id="sidebar-sections"></div>
  <div class="sidebar-bottom">
    <a class="sidebar-btn sidebar-home" href="/" title="Built by Zain: back to the portfolio"><span class="sb-emoji" aria-hidden="true">👋</span><span>Built by Zain</span></a>
    <button class="sidebar-av-btn" id="sidebar-avatar" onclick="sidebarNav('profile')" title="Your profile">
      <span class="sidebar-av-circle" id="sidebar-av-circle">Z</span>
      <span class="sidebar-av-label">Profile</span>
    </button>
  </div>
</aside>

<!-- App shell wraps top-bar + main -->
<div class="app-shell">

<header class="top-bar">
  <button class="top-bar-menu" id="hamburger" onclick="toggleSidebar()" aria-label="Toggle menu">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg>
  </button>
  <span class="top-bar-title" id="top-bar-title">Home</span>
  <div class="top-bar-right">
    <button class="top-bar-theme-btn" onclick="sidebarNav('search')" title="Search (/)" aria-label="Search"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></button>
    <button class="top-bar-theme-btn top-bar-keys" onclick="showShortcuts()" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts">?</button>
    <button class="theme-toggle top-bar-theme-btn" id="top-bar-theme" onclick="toggleTheme()" title="Switch to dark mode">🌙</button>
    <button class="top-bar-avatar" id="nav-avatar" onclick="sidebarNav('profile')" title="Your profile">Z</button>
  </div>
</header>

<main id="main-content" tabindex="-1">
  <!-- One h1 for the whole app, for screen readers and outlines. applyUnitChrome() keeps it on the active unit. -->
  <h1 class="sr-only" id="app-title">BTEC IT Revision</h1>

  <!-- HOME: greeting, Jump back in, Forgotten today, league (renderHome) -->
  <div class="page" id="page-home">
    <div id="home-content"></div>
  </div>

  <!-- LEARN: Path, Materials, Leaderboard (learn.js) -->
  <div class="page" id="page-learn">
    <div id="learn-content"></div>
  </div>

  <!-- EXAM: links to the six exam pages below -->
  <div class="page" id="page-exam">
    <div id="exam-content"></div>
  </div>

  <!-- QUESTIONS (also Past papers and Mocks) -->
  <div class="page" id="page-questions">
    <div id="questions-content"></div>
  </div>

  <!-- EXTENDED RESPONSE -->
  <div class="page" id="page-extended">
    <div id="extended-content"></div>
  </div>

  <!-- EXAM KIT -->
  <div class="page" id="page-examkit">
    <div id="examkit-content"></div>
  </div>

  <!-- REASONING TEST (shared by both units) -->
  <div class="page" id="page-aptitude">
    <div id="aptitude-content"></div>
  </div>

  <!-- SEARCH -->
  <div class="page" id="page-search">
    <div id="search-content"></div>
  </div>

  <!-- PROFILE -->
  <div class="page" id="page-profile">
    <div id="profile-content"></div>
  </div>

</main>

<!-- Phone bottom tab bar (under 768px) -->
<nav class="tabbar" aria-label="Main">
  <button class="tabbar-btn" data-page="home" onclick="sidebarNav('home')"><span class="sb-emoji" aria-hidden="true">🏠</span><span>Home</span></button>
  <button class="tabbar-btn" data-page="learn" onclick="sidebarNav('learn', {tab:'path'})"><span class="sb-emoji" aria-hidden="true">📚</span><span>Learn</span></button>
  <button class="tabbar-btn" data-page="exam" onclick="sidebarNav('exam')"><span class="sb-emoji" aria-hidden="true">📝</span><span>Exam</span></button>
  <button class="tabbar-btn" data-page="search" onclick="sidebarNav('search')"><span class="sb-emoji" aria-hidden="true">🔍</span><span>Search</span></button>
  <button class="tabbar-btn" data-page="profile" onclick="sidebarNav('profile')"><span class="sb-emoji" aria-hidden="true">👤</span><span>Profile</span></button>
</nav>

<button class="to-top" id="to-top" onclick="backToTop()" aria-label="Back to top" title="Back to top"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 15-6-6-6 6"/></svg></button>

</div><!-- /.app-shell -->

<!-- Full-screen round (round-view.js). Outside the shell so the shell can be made inert while it is open. -->
<div class="round-view" id="round-view" role="dialog" aria-modal="true" aria-label="Round" tabindex="-1" hidden></div>

<!-- Study dialog (learn.js): how to study a path node. Clicking the backdrop closes it. -->
<div class="study-overlay" id="study-dialog" hidden onclick="if(event.target===this)closeStudyDialog()"></div>

<!-- Right rail (1100px and up): the stats card (renderRightRail); hidden while empty. On phones the same card tops Home. -->
<aside class="right-rail" id="right-rail" aria-label="Your stats"></aside>

<div class="modal-overlay" id="player-modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="player-modal" role="dialog" aria-modal="true"></div>
</div>

<div id="toast" role="status" aria-live="polite">
  <span id="toast-icon"></span>
  <span id="toast-msg"></span>
  <div id="toast-bar"></div>
</div>

<script src="data_inline.js?v=26"></script>
<script src="ppp.js?v=2"></script>
<script src="league.js?v=2"></script>
<script src="memory.js?v=1"></script>
<script src="coins.js?v=1"></script>
<script src="app.js?v=40"></script>
<script src="round.js?v=6"></script>
<script src="round-view.js?v=6"></script>
<script src="learn.js?v=2"></script>
</body>
</html>
